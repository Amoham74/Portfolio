<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Houston Fight Shop</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .cart-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .cart-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item {
            display: flex;
            align-items: center;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
        }

        .cart-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            margin-right: 1rem;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-title {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .cart-item-price {
            color: #e63946;
            font-weight: bold;
        }

        .cart-item-quantity {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0.5rem 0;
        }

        .quantity-btn {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 0.25rem 0.5rem;
            cursor: pointer;
        }

        .quantity-input {
            width: 50px;
            text-align: center;
            border: 1px solid #ddd;
            padding: 0.25rem;
        }

        .remove-item {
            color: #dc3545;
            cursor: pointer;
            margin-left: 1rem;
        }

        .cart-summary {
            margin-top: 2rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 5px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 0.5rem 0;
        }

        .checkout-btn {
            display: block;
            width: 100%;
            padding: 1rem;
            background: #e63946;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 1rem;
            text-align: center;
        }

        .empty-cart {
            text-align: center;
            padding: 2rem;
        }

        .empty-cart i {
            font-size: 3rem;
            color: #ddd;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <h1>Houston Fight Shop</h1>
                </a>
            </div>
            <div class="nav-toggle" id="navToggle">
                <i class="fas fa-bars"></i>
            </div>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#featured">Featured</a></li>
                <li><a href="index.html#categories">Categories</a></li>
                <li><a href="index.html#powerkube">PowerKube</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li class="cart-icon"><a href="cart.html"><i class="fas fa-shopping-cart"></i> <span
                            id="cart-count">0</span></a></li>
            </ul>
        </div>
    </nav>

    <!-- Cart Content -->
    <div class="cart-container">
        <div class="cart-header">
            <h2>Your Shopping Cart</h2>
        </div>

        <div id="cart-items" class="cart-items">
            <!-- Cart items will be dynamically added here -->
        </div>

        <div id="cart-summary" class="cart-summary" style="display: none;">
            <div class="summary-row">
                <span>Subtotal:</span>
                <span id="subtotal">$0.00</span>
            </div>
            <div class="summary-row">
                <span>Shipping:</span>
                <span id="shipping">$0.00</span>
            </div>
            <div class="summary-row">
                <span>Tax:</span>
                <span id="tax">$0.00</span>
            </div>
            <div class="summary-row" style="font-weight: bold; font-size: 1.2rem;">
                <span>Total:</span>
                <span id="total">$0.00</span>
            </div>
            <button class="checkout-btn">Proceed to Checkout</button>
        </div>

        <div id="empty-cart" class="empty-cart">
            <i class="fas fa-shopping-cart"></i>
            <h3>Your cart is empty</h3>
            <p>Looks like you haven't added any items to your cart yet.</p>
            <a href="index.html#featured" class="cta-button">Continue Shopping</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Cart functionality
        document.addEventListener('DOMContentLoaded', function () {
            // Get cart data from localStorage
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartItemsContainer = document.getElementById('cart-items');
            const cartSummary = document.getElementById('cart-summary');
            const emptyCart = document.getElementById('empty-cart');
            const cartCount = document.getElementById('cart-count');

            function updateCartDisplay() {
                console.log('Updating cart display with cart:', cart); // Debug log
                cartItemsContainer.innerHTML = '';
                let subtotal = 0;

                if (cart.length === 0) {
                    cartSummary.style.display = 'none';
                    emptyCart.style.display = 'block';
                    cartCount.textContent = '0';
                    return;
                }

                emptyCart.style.display = 'none';
                cartSummary.style.display = 'block';
                cartCount.textContent = cart.length;

                cart.forEach((item, index) => {
                    const itemElement = document.createElement('div');
                    itemElement.className = 'cart-item';
                    itemElement.innerHTML = `
                        <img src="${item.image}" alt="${item.name}">
                        <div class="cart-item-details">
                            <h3 class="cart-item-title">${item.name}</h3>
                            <div class="cart-item-price">$${item.price.toFixed(2)}</div>
                            <div class="cart-item-quantity">
                                <button class="quantity-btn" onclick="updateQuantity(${index}, ${item.quantity - 1})">-</button>
                                <input type="number" class="quantity-input" value="${item.quantity}" min="1" onchange="updateQuantity(${index}, this.value)">
                                <button class="quantity-btn" onclick="updateQuantity(${index}, ${item.quantity + 1})">+</button>
                            </div>
                        </div>
                        <div class="remove-item" onclick="removeItem(${index})">
                            <i class="fas fa-trash"></i>
                        </div>
                    `;
                    cartItemsContainer.appendChild(itemElement);
                    subtotal += item.price * item.quantity;
                });

                const shipping = subtotal > 0 ? 5.99 : 0;
                const tax = subtotal * 0.0825; // 8.25% tax rate
                const total = subtotal + shipping + tax;

                document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
                document.getElementById('shipping').textContent = `$${shipping.toFixed(2)}`;
                document.getElementById('tax').textContent = `$${tax.toFixed(2)}`;
                document.getElementById('total').textContent = `$${total.toFixed(2)}`;
            }

            window.updateQuantity = function (index, newQuantity) {
                if (newQuantity < 1) return;
                cart[index].quantity = parseInt(newQuantity);
                localStorage.setItem('cart', JSON.stringify(cart));
                updateCartDisplay();
            }

            window.removeItem = function (index) {
                cart.splice(index, 1);
                localStorage.setItem('cart', JSON.stringify(cart));
                updateCartDisplay();
            }

            // Initial cart display
            console.log('Initial cart data:', cart); // Debug log
            updateCartDisplay();
        });
    </script>
</body>

</html>
